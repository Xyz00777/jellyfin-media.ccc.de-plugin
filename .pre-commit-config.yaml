repos:
  # Local system hooks avoid third-party repositories, network access, and extra supply-chain risk.
  - repo: local
    hooks:
      - id: check-version
        name: Check plugin and Jellyfin versions
        entry: bash scripts/check-version.sh
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: dotnet-format
        name: Verify .NET formatting
        entry: bash -c 'command -v dotnet >/dev/null || exit 0; dotnet format Jellyfin.Plugin.MediaCccDe.sln --verify-no-changes --no-restore'
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: whitespace
        name: Check trailing whitespace, final newlines, and tabs
        entry: sh scripts/check-whitespace.sh
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: shellcheck
        name: ShellCheck shell scripts
        entry: bash -c 'command -v shellcheck >/dev/null || exit 0; shellcheck "$@"' --
        language: system
        types: [shell]
