name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release guard compares the project version against existing tags, and a
          # default shallow checkout fetches none of them. Without the full history the
          # guard would pass on every run and silently protect nothing.
          fetch-depth: 0
      - name: Check plugin and Jellyfin versions
        env:
          # A pull_request checkout lands on a synthetic merge commit, so the release
          # guard reads the branch tip the pull request actually proposes.
          RELEASE_GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-version.sh
      - name: Test the release guard
        run: bash scripts/test-check-version.sh
      - name: Check whitespace and final newlines
        run: sh scripts/check-whitespace.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Jellyfin.Plugin.MediaCccDe.sln
      - name: Verify .NET formatting
        run: dotnet format Jellyfin.Plugin.MediaCccDe.sln --verify-no-changes --no-restore
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck and actionlint
        run: |
          shellcheck scripts/*.sh
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/ci.yml .github/workflows/release.yml
      - run: dotnet build Jellyfin.Plugin.MediaCccDe.sln --configuration Release --no-restore
      - run: dotnet test Jellyfin.Plugin.MediaCccDe.sln --configuration Release --no-build
